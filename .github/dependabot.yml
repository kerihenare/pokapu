version: 2

updates:
  - cooldown:
      default-days: 7
    directory: /
    groups:
      github-actions:
        patterns: ["*"]
    package-ecosystem: github-actions
    schedule:
      interval: weekly

  - cooldown:
      default-days: 7
    directory: /04-engineering/source
    groups:
      # Playwright's runner and browsers must stay on the same version. A dependency
      # joins the first group it matches, so this group must come first.
      playwright:
        patterns: ["playwright", "@playwright/test"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    package-ecosystem: npm
    schedule:
      interval: weekly
    versioning-strategy: increase
