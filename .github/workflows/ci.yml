name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.ref }}

permissions:
  contents: read

defaults:
  run:
    working-directory: 04-engineering/source

jobs:
  check:
    name: Format, lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: 04-engineering/source/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          cache-dependency-path: 04-engineering/source/pnpm-lock.yaml
          node-version-file: 04-engineering/source/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm browsers:install --with-deps chromium
      - run: pnpm test

  e2e:
    name: End-to-end and accessibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: 04-engineering/source/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          cache-dependency-path: 04-engineering/source/pnpm-lock.yaml
          node-version-file: 04-engineering/source/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm browsers:install --with-deps
      - run: pnpm test:e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: 04-engineering/source/apps/web-e2e/playwright-report/
          retention-days: 14
