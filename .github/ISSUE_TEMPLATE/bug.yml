name: Bug report
description: Something in Pokapu isn't working as it should.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **If it's a security problem, such as one Organisation being able to see another's data, don't report it here.** Follow [SECURITY.md](https://github.com/kerihenare/pokapu/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Go to …
        2. Select …
        3. See …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and version, operating system, assistive technology if any, and the Pokapu version or commit if you know it.
  - type: checkboxes
    id: accessibility
    attributes:
      label: Accessibility
      options:
        - label: This bug stops or makes it harder for someone using assistive technology, a keyboard, or other accessibility settings to use Pokapu.
